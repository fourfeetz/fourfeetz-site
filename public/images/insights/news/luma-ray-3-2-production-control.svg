<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936" role="img" aria-labelledby="title desc">
  <title id="title">Luma Ray3.2 production control</title>
  <desc id="desc">Editorial illustration of multiple keyframes connected to a professional video finishing pipeline</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16272a"/>
      <stop offset=".55" stop-color="#31575a"/>
      <stop offset="1" stop-color="#8b704f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dce9df"/>
      <stop offset="1" stop-color="#9db9a9"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
